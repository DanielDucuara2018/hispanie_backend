[database]
database = HISPANIE_DB_NAME_ENV
host = HISPANIE_DB_HOST_ENV
password = HISPANIE_DB_PASSWORD_ENV
port = HISPANIE_DB_PORT_ENV
user = HISPANIE_DB_USER_ENV
ref_table = HISPANIE_DB_REF_TABLE_ENV
alembic_migration = HISPANIE_DB_MIGRATION_ENV

[jwt]
secret_key = HISPANIE_JWT_SECRET_KEY_ENV
algorithm = HISPANIE_JWT_ALGORITHM_ENV
access_token_expire_minutes = HISPANIE_JWT_ACCESS_TOKEN_EXPIRE_MINUTES_ENV

[email]
secret_key = HISPANIE_EMAIL_SECRET_KEY_ENV
security_password_salt = HISPANIE_EMAIL_SECURITY_PASSWORD_SALT_ENV
frontend_url = HISPANIE_EMAIL_FRONTEND_URL_ENV
username = HISPANIE_EMAIL_USERNAME_ENV
password = HISPANIE_EMAIL_PASSWORD_ENV
address = HISPANIE_EMAIL_ADDRESS_ENV
port = HISPANIE_EMAIL_PORT_ENV
name = HISPANIE_EMAIL_NAME_ENV
server = HISPANIE_EMAIL_SERVER_ENV
start_tls = HISPANIE_EMAIL_START_TLS_ENV
ssl_tls = HISPANIE_EMAIL_SSL_TLS_ENV
credentials = HISPANIE_EMAIL_CREDENTIALS_ENV
validate_certs = HISPANIE_EMAIL_VALIDATE_CERTS_ENV

[aws]
bucket_name = HISPANIE_AWS_BUCKET_NAME_ENV
access_key = HISPANIE_AWS_ACCESS_KEY_ENV
secret_key = HISPANIE_AWS_SECRET_KEY_ENV
region = HISPANIE_AWS_REGION_ENV

[account]
username = HISPANIE_ACCOUNT_USERNAME_ENV
password = HISPANIE_ACCOUNT_PASSWORD_ENV
email = HISPANIE_ACCOUNT_EMAIL_ENV
phone = HISPANIE_ACCOUNT_PHONE_ENV
description = HISPANIE_ACCOUNT_DESCRIPTION_ENV
